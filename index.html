<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- ESSENCIAL p/ celular: faz a página usar a largura real da tela (sem zoom de desktop) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8efe7">
<title>Blow Girl Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   PALETA E MEDIDAS — nude + rosa da logo + branco
   ============================================================ */
:root{
  --nude:#f8efe7;         /* fundo nude da página */
  --nude-2:#f2e4d9;       /* nude um pouco mais fechado */
  --card:#ffffff;         /* branco dos cards = branco das fotos */
  --pink:#f163a2;         /* rosa da logo */
  --pink-ink:#ed5296;     /* rosa p/ toque/hover */
  --pink-soft:#fcdcec;    /* rosa bem suave */
  --pink-tint:#fdeef6;    /* quase branco rosado */
  --ink:#5d3a4b;          /* texto principal */
  --ink-soft:#8f6e7d;     /* texto secundário */
  --line:#efe0d6;         /* bordas suaves */
  --shadow:0 12px 30px rgba(180,120,150,.20);
  --shadow-sm:0 6px 16px rgba(180,120,150,.14);

  --lateral:12px;         /* espaço entre o card e a borda da tela (nude aparecendo) */
  --entre-cards:16px;     /* espaço entre um card e outro */
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;overflow-x:hidden}
img{max-width:100%;display:block}
[hidden]{display:none!important}
body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(180deg,#fbe9f0 0%, var(--nude) 220px, var(--nude-2) 100%);
  background-color:var(--nude);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body.lock{overflow:hidden}

/* ---------- CABEÇALHO (logo grande) ---------- */
header{
  text-align:center;
  padding:calc(18px + env(safe-area-inset-top,0px)) var(--lateral) 14px;
}
.logo-wrap{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--card);border-radius:50%;
  width:132px;height:132px;box-shadow:var(--shadow);
}
.logo-wrap img{width:108px;height:auto}
header p.tag{margin:12px auto 0;color:var(--ink-soft);font-size:15px;line-height:1.4}

/* ---------- LISTA DE PRODUTOS (um abaixo do outro) ---------- */
main{
  padding:0 var(--lateral) calc(110px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;
}
.grid{display:flex;flex-direction:column;gap:var(--entre-cards)}
.card{
  background:var(--card);border-radius:22px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow-sm);
}
/* ---------- CARROSSEL DE FOTOS (arrastar pro lado) ---------- */
/* área da foto SEMPRE quadrada (1:1); foto vertical ou horizontal se encaixa dentro dela */
.card .photo{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--card)}
.track{
  position:absolute;inset:0;
  display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  overscroll-behavior-x:contain;scrollbar-width:none;
}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}
.slide img{width:100%;height:100%;object-fit:contain;padding:14px}
.dots{
  position:absolute;left:0;right:0;bottom:10px;
  display:flex;justify-content:center;gap:6px;pointer-events:none;
}
.dot{width:8px;height:8px;border-radius:999px;background:var(--pink-soft);transition:width .2s, background .2s}
.dot.on{width:22px;background:var(--pink)}
.nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:40px;border-radius:999px;border:none;cursor:pointer;
  background:rgba(255,255,255,.92);color:var(--pink-ink);box-shadow:var(--shadow-sm);
  font-size:24px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:opacity .2s;
}
.nav.prev{left:8px}
.nav.next{right:8px}
.nav:disabled{opacity:0;pointer-events:none}

/* ---------- TEXTO DO CARD (mesma altura em todos) ---------- */
.card .body{padding:4px 18px 18px;display:flex;flex-direction:column;gap:8px}
.card .txt{
  /* altura fixa = 2 linhas de nome + 2 linhas de descrição → todos os cards iguais */
  height:calc(2 * 21px * 1.25 + 8px + 2 * 15px * 1.45);
  display:flex;flex-direction:column;gap:8px;overflow:hidden;
}
.card h3{
  margin:0;font-weight:700;font-size:21px;line-height:1.25;color:var(--ink);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;
}
.card .desc{
  margin:0;font-size:15px;color:var(--ink-soft);line-height:1.45;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;
}
.card .more{
  align-self:flex-start;margin-top:-4px;padding:2px 0;border:none;background:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;color:var(--pink-ink);text-decoration:underline;
}
.card .more.off{visibility:hidden}
/* "Ver mais" aberto: mostra tudo */
.card.open .txt{height:auto}
.card.open h3,.card.open .desc{-webkit-line-clamp:unset;line-clamp:none;display:block}
.card .price{font-weight:800;color:var(--pink-ink);font-size:26px;font-variant-numeric:tabular-nums}
.card button.add{
  margin-top:4px;border:none;cursor:pointer;width:100%;
  background:var(--pink);color:#fff;font-weight:700;font-size:18px;font-family:inherit;
  height:56px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s, transform .1s;
}
.card button.add:active{transform:scale(.97);background:var(--pink-ink)}
.card button.add.in-cart{background:var(--pink-soft);color:var(--pink-ink)}

/* ---------- BOLINHA DO CARRINHO (canto inferior direito) ---------- */
.cart-fab{
  position:fixed;z-index:30;
  right:calc(16px + env(safe-area-inset-right,0px));
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  height:72px;min-width:72px;padding:0;border:none;border-radius:999px;cursor:pointer;
  background:var(--pink);color:#fff;
  box-shadow:0 10px 26px rgba(241,99,162,.45);
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:inherit;font-weight:700;font-size:18px;
  transition:transform .15s, padding .2s;
}
.cart-fab:active{transform:scale(.93)}
.cart-fab .fab-ico{font-size:32px;line-height:1}
.cart-fab .fab-label,.cart-fab .count{display:none}
.cart-fab .count{
  background:#fff;color:var(--pink-ink);min-width:30px;height:30px;border-radius:999px;
  align-items:center;justify-content:center;font-size:16px;padding:0 8px;font-weight:800;
}
/* com itens: vira pílula "Carrinho" + quantidade */
.cart-fab.has-items{padding:0 18px 0 16px}
.cart-fab.has-items .fab-label{display:inline}
.cart-fab.has-items .count{display:inline-flex}

/* ---------- TELA DO CARRINHO (tela cheia, mesma página) ---------- */
.sheet{
  position:fixed;inset:0;z-index:50;background:var(--nude);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  visibility:hidden;
}
.sheet.open{transform:translateY(0);visibility:visible}
.sheet-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  background:var(--card);box-shadow:0 2px 12px rgba(180,120,150,.12);
}
.sheet-head h2{margin:0;font-family:'Pacifico',cursive;font-weight:400;font-size:28px;color:var(--pink-ink)}
.sheet-head .close{
  width:46px;height:46px;border-radius:999px;border:none;cursor:pointer;
  background:var(--pink-soft);color:var(--pink-ink);font-size:28px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.sheet-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;
}
.box{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow-sm)}
.box-title{margin:0 0 12px;font-size:17px;font-weight:700;color:var(--ink)}

.empty{text-align:center;color:var(--ink-soft);font-size:16px;line-height:1.5;padding:12px 4px}
.empty .big{font-size:44px;display:block;margin-bottom:8px}

.items{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:12px;align-items:center}
.item + .item{padding-top:12px;border-top:1px solid var(--line)}
.item .thumb{width:76px;height:76px;border-radius:14px;flex:0 0 auto;border:1px solid var(--line);background:var(--card)}
.item .thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
.item .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.item .nm{font-weight:600;font-size:16px;line-height:1.25;color:var(--ink)}
.item .pr{color:var(--pink-ink);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.item .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{
  width:40px;height:40px;border-radius:999px;border:none;cursor:pointer;
  background:var(--pink-soft);color:var(--pink-ink);font-size:22px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.qty span{min-width:22px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.rm{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;text-decoration:underline;padding:6px 0;font-family:inherit}

.field{display:flex;flex-direction:column;gap:8px}
.field + .field{margin-top:14px}
.field label.lbl{font-size:15px;font-weight:600;color:var(--ink)}
.field input,.field textarea{
  font-family:inherit;font-size:17px;padding:14px 15px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--nude);color:var(--ink);width:100%;
}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--pink);background:var(--pink-tint)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pays label{
  display:flex;align-items:center;gap:10px;cursor:pointer;min-height:56px;
  border:1.5px solid var(--line);background:var(--nude);border-radius:14px;padding:0 14px;
  font-size:17px;font-weight:500;color:var(--ink);
}
.pays label:has(input:checked){border-color:var(--pink);background:var(--pink-soft);color:var(--pink-ink);font-weight:700}
.pays input{accent-color:var(--pink-ink);width:22px;height:22px;margin:0;flex:0 0 auto}

.totrow{display:flex;justify-content:space-between;align-items:center}
.totrow .lbl{color:var(--ink);font-size:18px;font-weight:600}
.totrow .val{font-weight:800;color:var(--pink-ink);font-size:30px;font-variant-numeric:tabular-nums}
.checkout{
  margin-top:14px;width:100%;height:62px;border:none;border-radius:18px;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:19px;color:#fff;background:var(--pink);
  box-shadow:0 8px 20px rgba(241,99,162,.35);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.checkout:active{transform:scale(.98);background:var(--pink-ink)}
.checkout:disabled{opacity:.45}
.hint{margin:12px 0 0;font-size:14px;color:var(--ink-soft);text-align:center;line-height:1.45}
.hint.err{color:var(--pink-ink);font-weight:600}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="logo-wrap"><img src="logo-blow.webp" alt="Blow Girl"></div>
  <p class="tag">✨ Beleza e autocuidado · Revenda oficial ✨</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<button class="cart-fab" id="cartFab" aria-label="Abrir carrinho">
  <span class="fab-ico">🛍️</span>
  <span class="fab-label">Carrinho</span>
  <span class="count" id="fabCount">0</span>
</button>

<!-- TELA DO CARRINHO -->
<section class="sheet" id="sheet" aria-label="Seu carrinho">
  <div class="sheet-head">
    <h2>Seu carrinho</h2>
    <button class="close" id="closeBtn" aria-label="Fechar carrinho">×</button>
  </div>
  <div class="sheet-body">
    <div class="box">
      <p class="box-title">Seus produtos</p>
      <div class="items" id="items"></div>
    </div>

    <div class="box" id="formBox">
      <div class="field">
        <label class="lbl" for="nome">Seu nome</label>
        <input id="nome" type="text" placeholder="Digite seu nome" autocomplete="name">
      </div>
      <div class="field">
        <span class="lbl" style="font-size:15px;font-weight:600">Forma de pagamento</span>
        <div class="pays">
          <label><input type="radio" name="pay" value="Pix"> Pix</label>
          <label><input type="radio" name="pay" value="Cartão de crédito"> Crédito</label>
          <label><input type="radio" name="pay" value="Cartão de débito"> Débito</label>
          <label><input type="radio" name="pay" value="Dinheiro"> Dinheiro</label>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="obs">Observações (opcional)</label>
        <textarea id="obs" placeholder="Ex: ponto de entrega, troco, etc."></textarea>
      </div>
    </div>

    <div class="box">
      <div class="totrow">
        <span class="lbl">Total</span>
        <span class="val" id="total">R$ 0,00</span>
      </div>
      <button class="checkout" id="checkout">Finalizar pelo WhatsApp</button>
      <p class="hint" id="hint">O pagamento é combinado com a vendedora pelo WhatsApp 💕</p>
    </div>
  </div>
</section>

   💻  LÓGICA DO CATÁLOGO  (não precisa mexer daqui pra baixo)
   ============================================================ */
const brl = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const byId = Object.fromEntries(PRODUTOS.map(p=>[p.id,p]));
const $ = id => document.getElementById(id);

let cart = {};
try{ cart = JSON.parse(localStorage.getItem('blow_cart')||'{}'); }catch(e){ cart = {}; }
function saveCart(){ try{ localStorage.setItem('blow_cart',JSON.stringify(cart)); }catch(e){} }

const totalItems = () => Object.values(cart).reduce((a,b)=>a+b,0);
const totalPrice = () => Object.entries(cart).reduce((s,[id,q])=>s+(byId[id]?byId[id].preco*q:0),0);
const entries = () => Object.entries(cart).filter(([id,q])=>q>0 && byId[id]);

function carousel(p){
  const fotos = p.fotos;
  const slides = fotos.map((f,i)=>`
    <div class="slide"><img src="${f}" alt="${p.nome} – foto ${i+1}" ${i>0?'loading="lazy"':''}></div>`).join('');
  if(fotos.length<2) return `<div class="photo"><div class="track">${slides}</div></div>`;
  return `<div class="photo">
      <div class="track">${slides}</div>
      <button class="nav prev" aria-label="Foto anterior" disabled>‹</button>
      <button class="nav next" aria-label="Próxima foto">›</button>
      <div class="dots">${fotos.map((_,i)=>`<span class="dot${i===0?' on':''}"></span>`).join('')}</div>
    </div>`;
}

function renderGrid(){
  $('grid').innerHTML = PRODUTOS.map(p=>`
    <article class="card" data-id="${p.id}">
      ${carousel(p)}
      <div class="body">
        <div class="txt">
          <h3>${p.nome}</h3>
          <p class="desc">${p.descricao}</p>
        </div>
        <button class="more off" type="button">Ver mais</button>
        <span class="price">${brl(p.preco)}</span>
        <button class="add" data-id="${p.id}"></button>
      </div>
    </article>`).join('');

  // carrossel: atualiza bolinhas e setas conforme a foto visível
  document.querySelectorAll('.card .photo').forEach(photo=>{
    const track = photo.querySelector('.track');
    const dots = photo.querySelectorAll('.dot');
    if(!dots.length) return;
    const prev = photo.querySelector('.prev'), next = photo.querySelector('.next');
    track.addEventListener('scroll',()=>{
      const i = Math.round(track.scrollLeft / track.clientWidth);
      dots.forEach((d,k)=>d.classList.toggle('on',k===i));
      prev.disabled = i<=0;
      next.disabled = i>=dots.length-1;
    },{passive:true});
  });

  renderButtons();
  fitText();
}

// deixa todos os cards com a mesma altura de texto:
// nome com 1 linha → descrição mostra 3 linhas; nome com 2 linhas → descrição mostra 2
function fitText(){
  document.querySelectorAll('.card').forEach(card=>{
    if(card.classList.contains('open')) return;
    const h3 = card.querySelector('h3'), desc = card.querySelector('.desc'), more = card.querySelector('.more');
    const lh = parseFloat(getComputedStyle(h3).lineHeight);
    const titleLines = Math.round(h3.getBoundingClientRect().height / lh);
    const n = titleLines>=2 ? 2 : 3;
    desc.style.webkitLineClamp = n;
    desc.style.lineClamp = n;
    more.classList.toggle('off', desc.scrollHeight <= desc.clientHeight + 2 && h3.scrollHeight <= h3.clientHeight + 2);
  });
}

// atualiza só os botões "Adicionar" (sem redesenhar os cards → carrossel não volta pra 1ª foto)
function renderButtons(){
  document.querySelectorAll('button.add').forEach(b=>{
    const q = cart[b.dataset.id];
    b.classList.toggle('in-cart', !!q);
    b.textContent = q ? `✓ No carrinho (${q})` : '+ Adicionar';
  });
}

function renderCart(){
  const count = totalItems();
  $('cartFab').classList.toggle('has-items', count>0);
  $('fabCount').textContent = count;
  $('total').textContent = brl(totalPrice());
  $('checkout').disabled = count===0;

  const list = entries();
  if(list.length===0){
    $('items').innerHTML = `<div class="empty"><span class="big">🛍️</span>Seu carrinho está vazio.<br>Adicione produtos para continuar 💕</div>`;
    return;
  }
  $('items').innerHTML = list.map(([id,q])=>{
    const p = byId[id];
    return `<div class="item">
      <div class="thumb"><img src="${p.fotos[0]}" alt="${p.nome}"></div>
      <div class="info">
        <div class="nm">${p.nome}</div>
        <div class="pr">${brl(p.preco*q)}</div>
        <div class="row">
          <div class="qty">
            <button data-dec="${id}" aria-label="Diminuir">−</button>
            <span>${q}</span>
            <button data-inc="${id}" aria-label="Aumentar">+</button>
          </div>
          <button class="rm" data-rm="${id}">Remover</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function refresh(){ saveCart(); renderButtons(); renderCart(); }

function addToCart(id){
  cart[id] = (cart[id]||0) + 1;
  refresh();
  $('cartFab').animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:280});
}

function openCart(){ $('sheet').classList.add('open'); document.body.classList.add('lock'); }
function closeCart(){ $('sheet').classList.remove('open'); document.body.classList.remove('lock'); }

$('cartFab').addEventListener('click',openCart);
$('closeBtn').addEventListener('click',closeCart);

$('grid').addEventListener('click',e=>{
  const add = e.target.closest('button.add');
  if(add) return addToCart(add.dataset.id);

  const nav = e.target.closest('.nav');
  if(nav){
    const track = nav.parentElement.querySelector('.track');
    track.scrollBy({left:(nav.classList.contains('next')?1:-1)*track.clientWidth});
    return;
  }

  const more = e.target.closest('.more');
  if(more){
    const card = more.closest('.card');
    const open = card.classList.toggle('open');
    more.textContent = open ? 'Ver menos' : 'Ver mais';
    const desc = card.querySelector('.desc');
    if(open){ desc.style.webkitLineClamp = ''; desc.style.lineClamp = ''; }
    else fitText();
  }
});

// recalcula a altura dos textos quando a fonte carrega ou a tela gira
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);
window.addEventListener('resize',fitText);

$('items').addEventListener('click',e=>{
  const inc=e.target.closest('[data-inc]'), dec=e.target.closest('[data-dec]'), rm=e.target.closest('[data-rm]');
  if(inc){ cart[inc.dataset.inc]++; }
  else if(dec){ const id=dec.dataset.dec; cart[id]--; if(cart[id]<=0) delete cart[id]; }
  else if(rm){ delete cart[rm.dataset.rm]; }
  else return;
  refresh();
});

$('checkout').addEventListener('click',()=>{
  const nome = $('nome').value.trim();
  const pay  = document.querySelector('input[name="pay"]:checked');
  const obs  = $('obs').value.trim();
  const hint = $('hint');

  if(totalItems()===0) return;
  if(!nome){ hint.textContent='⚠️ Digite seu nome para finalizar.'; hint.classList.add('err'); $('nome').focus(); return; }
  if(!pay){ hint.textContent='⚠️ Escolha uma forma de pagamento.'; hint.classList.add('err'); return; }
  hint.textContent='O pagamento é combinado com a vendedora pelo WhatsApp 💕'; hint.classList.remove('err');

  const linhas = entries().map(([id,q])=>`• ${q}x ${byId[id].nome} — ${brl(byId[id].preco*q)}`).join('\n');

  let msg = `🌸 *NOVO PEDIDO — BLOW GIRL* 🌸\n\n`;
  msg += `👤 *Cliente:* ${nome}\n\n`;
  msg += `🛒 *Itens do pedido:*\n${linhas}\n\n`;
  msg += `💰 *Total:* ${brl(totalPrice())}\n`;
  msg += `💳 *Forma de pagamento:* ${pay.value}\n`;
  if(obs) msg += `📝 *Observações:* ${obs}\n`;
  msg += `\nObrigada pela preferência! 💕`;

  window.location.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
});

renderGrid();
renderCart();
</script>
</body>
</html>
